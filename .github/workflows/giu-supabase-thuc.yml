# ============================================================
# Giữ cho cơ sở dữ liệu các trường khỏi NGỦ
#
# Supabase gói miễn phí cho dự án ngủ khi lâu không có hoạt động. Robot này
# chạy MỖI NGÀY, gửi tới mỗi trường truy vấn nhẹ (PostgREST + Auth, thử lại 3 lần).
# Có trường không gọi được thì mở/cập nhật MỘT issue trên kho mã; hết hỏng tự đóng.
#
# 🔴 15/9/2026: bản 3 ngày/lần để Nguyễn Kiệm ngủ dù ping 13/9 được HTTP 200,
#    và báo "failure" 5 lượt (1/9 → 13/9: Hòa Hiếu 1, Thần Lĩnh 1 ngủ) mà không
#    ai biết — xem đầu .github/scripts/giu-supabase-thuc.js.
#
# 🔑 GitHub TỰ TẮT lịch chạy nếu kho mã 60 ngày không có gì mới. Nghỉ hè không
#    ai commit là đúng lúc cần robot nhất thì nó lại vừa bị tắt. Vì vậy mỗi
#    THÁNG robot ghi một dòng mốc rồi commit — kho mã luôn có hoạt động.
#    (Ghi mỗi lần chạy thì lịch sử đầy commit rác, nên chỉ ghi khi sang tháng.)
#
# Chạy tay bất cứ lúc nào: tab Actions → chọn workflow này → Run workflow.
# ============================================================
name: Giữ Supabase các trường khỏi ngủ

on:
  schedule:
    # Mỗi ngày hai lượt: 03:11 UTC = 10:11 và 13:41 UTC = 20:41 giờ Việt Nam.
    # Giờ lẻ cho khỏi rơi đúng lúc GitHub đông việc; hai lượt để một lượt bị
    # GitHub bỏ (chuyện có xảy ra khi máy chủ quá tải) vẫn còn lượt kia.
    - cron: '11 3 * * *'
    - cron: '41 13 * * *'
  workflow_dispatch:

permissions:
  contents: write        # để ghi tệp mốc mỗi tháng
  issues: write          # để mở issue báo trường ngủ — chỗ thầy Chung nhìn thấy

concurrency:
  group: giu-supabase
  cancel-in-progress: false

jobs:
  giu-thuc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gửi truy vấn tới từng trường
        run: node .github/scripts/giu-supabase-thuc.js
        env:
          # KHÔNG tự có trong môi trường bước chạy — thiếu dòng này thì robot
          # im lặng bỏ qua phần mở issue (lượt thử 15/9/2026 dính đúng thế).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Chống việc GitHub tắt lịch chạy sau 60 ngày kho mã im lặng.
      # always() để bước này vẫn chạy khi có trường không gọi được — lúc đó
      # càng cần giữ robot sống để lần sau còn thử lại.
      - name: Ghi mốc tháng (giữ cho lịch chạy khỏi bị tắt)
        if: always()
        run: |
          thang=$(date -u +%Y-%m)
          moc=.github/moc-giu-song.txt
          if [ "$(cat $moc 2>/dev/null)" = "$thang" ]; then
            echo "Đã có mốc tháng $thang — không cần ghi lại."
            exit 0
          fi
          echo "$thang" > $moc
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $moc
          git commit -m "chore: moc giu lich chay thang $thang"
          git push
