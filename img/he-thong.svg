<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Quản trị số nhà trường">
  <!-- Biểu trưng TRUNG TÍNH của hệ thống — KHÔNG mang tên, dấu hay ảnh của
       trường nào. Dùng ở cổng chung, ở bản xem thử, và làm ảnh dự phòng khi
       một trường chưa gửi logo riêng.
       Trước đây ba chỗ đó đều rơi về img/logo.png — mà tệp ấy chính là con dấu
       Trường Tiểu học Diễn Liên, có in tên trường và tên xã trên hình. Nghĩa là
       khách lạ mở địa chỉ giới thiệu lại thấy con dấu một trường cụ thể.

       Vẽ lại 20/8/2026 theo logo Quản trị số nhà trường (logo-moi/Logo_App.png):
       cùng nền navy, cùng ba thanh sáng dần, cùng chuỗi ô vuông, cùng dấu tick.
       CỐ Ý BỎ chữ và mái nhà — favicon chạy ở 16-32px, chữ ở cỡ đó nát thành
       vệt xám còn mái nhà chồng lên đuôi dấu tick. Bản ảnh đầy đủ có chữ nằm ở
       img/he-thong.png, dùng cho những chỗ hiển thị to. -->
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#0b3989"/>
      <stop offset="1" stop-color="#001b4d"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="40" fill="#062d72"/>
  <rect width="256" height="256" rx="40" fill="url(#nen)"/>

  <!-- Ba dòng hồ sơ, sáng dần từ trên xuống như trong logo -->
  <g stroke-linecap="round" stroke-width="26">
    <path d="M46 58h102"  stroke="#fbfafa"/>
    <path d="M46 97h102"  stroke="#c6ddfc"/>
    <path d="M46 136h102" stroke="#568fe9"/>
  </g>

  <!-- Chuỗi ô vuông: dòng cuối tan thành dữ liệu số -->
  <g fill="#5099fe">
    <rect x="170" y="34" width="18" height="18" rx="5"/>
    <rect x="204" y="52" width="18" height="18" rx="5"/>
    <rect x="168" y="76" width="16" height="16" rx="5"/>
  </g>
  <rect x="206" y="90" width="17" height="17" rx="5" fill="#f6b51c"/>

  <!-- Dấu tick — việc đã hoàn thành -->
  <path d="M118 182l32 30 64-72" fill="none" stroke="#f6b51c"
        stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
